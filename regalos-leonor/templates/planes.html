<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Planes juntos</title><link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"><style>
body{background:linear-gradient(160deg,#EBF5FB,#F4ECF7 50%,#FEF0F2);min-height:100vh;padding:0 20px 80px}.feature-header{text-align:center;padding:42px 10px 24px}.feature-header h1{color:#3D4A5C;font-size:clamp(1.8rem,5vw,2.6rem);font-style:italic;margin:10px 0 8px}.feature-header p{color:#C39BD3;font-family:'Dancing Script',cursive;font-size:1.15rem}.back-link{display:inline-flex;color:#85C1E9;text-decoration:none;font-weight:700}.planner{max-width:920px;margin:auto;display:grid;grid-template-columns:minmax(250px,.8fr) 1.2fr;gap:22px}.panel,.plan{background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-radius:22px;padding:24px;box-shadow:0 6px 24px rgba(133,193,233,.17)}.panel h2{color:#3D4A5C;font-size:1.15rem;margin-bottom:16px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:.78rem;color:#6B7A8D;font-weight:700}.field input,.field select,.field textarea{border:1px solid #DCE8F2;border-radius:12px;padding:10px;font:inherit;color:#3D4A5C;background:#fff}.field textarea{resize:vertical}.save{border:0;border-radius:50px;padding:11px 18px;background:linear-gradient(135deg,#A8D8EA,#5DADE2);color:#fff;font-weight:700;cursor:pointer}.plans{display:grid;gap:12px}.plan{padding:18px;cursor:pointer;border:1px solid rgba(255,255,255,.75)}.plan h3{color:#3D4A5C;font-size:1.05rem}.plan p{color:#6B7A8D;font-size:.88rem;line-height:1.5;margin-top:5px}.badge{display:inline-block;margin-top:10px;padding:5px 11px;border-radius:50px;background:#CDF0DC;color:#1E8449;font-size:.7rem;font-weight:700}.badge.pasado{background:#F5D6DB;color:#B03A4B}.empty{text-align:center;color:#9BAAB8;padding:25px}.notice{min-height:20px;color:#1E8449;font-size:.8rem;margin-top:8px}@media(max-width:720px){.planner{grid-template-columns:1fr}}
</style></head><body><div class="petal-container"></div><header class="feature-header"><a class="back-link" href="{{ url_for('menu') }}">← Volver</a><h1>Nuestros planes</h1><p>Vamos guardando las salidas que queremos vivir juntos.</p></header><main class="planner"><form class="panel" id="plan-form"><h2>Agregar una salida</h2><div class="field"><label for="lugar">Lugar</label><input id="lugar" required placeholder="Ej. Parque del centro"></div><div class="field"><label for="fecha">Fecha</label><input id="fecha" type="date" required></div><div class="field"><label for="hora">Hora</label><input id="hora" type="time" required></div><div class="field"><label for="estado">Estado</label><select id="estado"><option value="pendiente">Pendiente</option><option value="pasado">Ya pasó</option></select></div><div class="field"><label for="nota">Nota</label><textarea id="nota" rows="3" placeholder="Qué haremos..." ></textarea></div><button class="save" type="submit">Guardar salida</button><div class="notice" id="notice"></div></form><section class="plans" id="plans"><div class="empty">Cargando nuestras salidas...</div></section></main><script>
const plans=document.querySelector('#plans'),form=document.querySelector('#plan-form'),notice=document.querySelector('#notice');
function paint(items){plans.innerHTML=items.length?items.map(p=>`<article class="plan" tabindex="0" data-id="${p.id}"><h3>📍 ${p.lugar}</h3><p>📅 ${p.fecha} · ⏰ ${p.hora}</p><p>${p.nota||'Una nueva aventura para los dos.'}</p><span class="badge ${p.estado==='pasado'?'pasado':''}">${p.estado==='pasado'?'Ya pasó':'Pendiente'}</span></article>`).join(''):'<div class="empty">Todavía no hay salidas guardadas.</div>';}
async function load(){const r=await fetch('/api/planes');const d=await r.json();paint(d.planes||[])}
form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/planes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){form.reset();notice.textContent='Salida guardada para ustedes.';load()}else notice.textContent=(await r.json()).error});load();
</script></body></html>
