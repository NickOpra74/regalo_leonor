<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro tiempo 💙</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body { background: linear-gradient(160deg,#EBF5FB 0%,#F4ECF7 50%,#FEF0F2 100%); min-height:100vh; padding:0 20px 80px; }
    .feature-header { text-align:center; padding:42px 10px 24px; position:relative; z-index:2; }
    .feature-header h1 { color:#3D4A5C; font-size:clamp(1.8rem,5vw,2.6rem); font-style:italic; margin:10px 0 8px; }
    .feature-header p { color:#C39BD3; font-family:'Dancing Script',cursive; font-size:1.15rem; }
    .feature-wrap { max-width:860px; margin:auto; position:relative; z-index:2; }
    .time-card, .anniversary-card { background:rgba(255,255,255,.8); backdrop-filter:blur(12px); border-radius:24px; padding:28px; text-align:center; box-shadow:0 8px 28px rgba(133,193,233,.18); margin-bottom:22px; }
    .time-card h2,.anniversary-card h2 { color:#3D4A5C; font-size:1.3rem; margin-bottom:20px; }
    .counter { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .unit { background:linear-gradient(145deg,#C8E6FA,#F7CAD0); border-radius:16px; padding:16px 8px; }
    .unit strong { display:block; color:#3D4A5C; font-size:clamp(1.4rem,5vw,2.2rem); }
    .unit span { color:#6B7A8D; font-size:.75rem; text-transform:uppercase; letter-spacing:.4px; }
    .anniversary-date { color:#5DADE2; font-size:1.25rem; font-weight:700; margin:8px 0 14px; }
    .anniversary-note { color:#6B7A8D; line-height:1.6; }
    .back-link { display:inline-flex; color:#85C1E9; text-decoration:none; font-weight:700; }
    @media(max-width:520px){.counter{grid-template-columns:repeat(2,1fr)}.time-card,.anniversary-card{padding:22px 16px}}
  </style>
</head>
<body>
  <div class="petal-container"></div>
  <header class="feature-header"><a class="back-link" href="{{ url_for('menu') }}">← Volver</a><h1>El tiempo juntos ⏳</h1><p>Desde el 1 de diciembre de 2025, cada día cuenta.</p></header>
  <main class="feature-wrap">
    <section class="time-card" aria-live="polite"><h2>Llevamos juntos</h2><div class="counter"><div class="unit"><strong id="years">0</strong><span>Años</span></div><div class="unit"><strong id="months">0</strong><span>Meses</span></div><div class="unit"><strong id="days">0</strong><span>Días</span></div><div class="unit"><strong id="hours">0</strong><span>Horas</span></div></div></section>
    <section class="anniversary-card"><h2>Próximo aniversario 💙</h2><div class="anniversary-date" id="anniversary-date"></div><p class="anniversary-note" id="anniversary-countdown"></p></section>
  </main>
  <script src="{{ url_for('static', filename='js/tiempo.js') }}"></script>
</body>
</html>
